[config]
palette_mode = "expressive"

[templates.kitty]
input_path = "/home/pixy/.config/matugen/templates/kitty.conf"
output_path = "/home/pixy/.config/kitty/matugen-theme.conf"

[templates.mango_colors]
input_path = "/home/pixy/.config/matugen/templates/mango.toml"
output_path = "/home/pixy/.config/mango/theme_colors.conf"

[templates.waybar_colors]
input_path = "/home/pixy/.config/matugen/templates/waybar.css"
output_path = "/home/pixy/.config/waybar/colors.css"

[templates.rofi]
input_path = "~/.config/rofi/colors.rasi.template"
output_path = "~/.config/rofi/colors.rasi"

[templates.swaync]
input_path = "~/.config/matugen/templates/swaync-colors.css"
output_path = "~/.config/swaync/colors.css"

[templates.wlogout]
input_path = '~/.config/matugen/templates/wlogout.css'
output_path = '~/.config/wlogout/style.css'

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk3-colors.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk3-colors.css"
output_path = "~/.config/gtk-4.0/colors.css"

[[config.outputs]]
template = "/home/pixy/.config/matugen/templates/firefox_websites.css"
destination = "/home/pixy/.config/matugen/generated/firefox_websites.css"

[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock.conf"
output_path = "~/.config/hypr/hyprlock-colors.conf"

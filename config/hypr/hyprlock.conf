source = ~/.config/hypr/hyprlock-colors.conf

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 4
    noise = 0.008
    contrast = 0.95
    brightness = 0.85
}

shape {
    monitor =
    size = 380, 310
    color = $primary_60
    rounding = 32
    border_size = 2
    border_color = $primary_aa
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $on_surface
    font_size = 76
    font_family = JetBrains Mono SemiBold
    position = 0, 108
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B')"
    color = $on_surface_aa
    font_size = 13
    font_family = JetBrains Mono
    position = 0, 46
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 220, 42
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = $primary_aa
    inner_color = $surface_30
    font_color = $on_surface
    placeholder_text =
    rounding = 999
    fade_on_empty = false
    capslock_color = $primary_aa
    check_color = $primary
    fail_color = ff0000ff
    position = 0, -72
    halign = center
    valign = center
}
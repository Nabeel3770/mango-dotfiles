# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=1
blur_layer=0.85
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=7
blur_params_noise=0.012
blur_params_brightness=0.85
blur_params_contrast=1.0
blur_params_saturation=1.4

shadows=1
layer_shadows=1
shadow_only_floating=0
shadows_size=18
shadows_blur=16
shadows_position_x=0
shadows_position_y=3
shadowscolor=0x00000033

border_radius=16
no_radius_when_single=0
focused_opacity=0.90
unfocused_opacity=0.87

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.88
zoom_end_ratio=0.94
fadein_begin_opacity=0.0
fadeout_begin_opacity=1.0
animation_duration_move=380
animation_duration_open=420
animation_duration_tag=320
animation_duration_close=260
animation_duration_focus=180
animation_curve_open=0.34,1.4,0.64,1
animation_curve_move=0.25,1.0,0.5,1
animation_curve_tag=0.34,1.4,0.64,1
animation_curve_close=0.55,0,1,0.45
animation_curve_focus=0.4,0,0.2,1
animation_curve_opafadeout=0.4,0,0.2,1
animation_curve_opafadein=0.25,1.0,0.5,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance

source=~/.config/mango/theme_colors.conf

gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=1.0
scratchpad_height_ratio=1.0
borderpx=2
rootcolor=0x201b14ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
maximizescreencolor=0x89aa61ff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

bind=super,e,spawn,thunar
bind=super,b,spawn,librewolf
bind=super,w,spawn,~/.config/mango/change_theme.sh
bind=super,f,togglefullscreen
bind=super,l,spawn,hyprlock

#-----SCREENSHOTS-----
# Copy
bind=super, c, spawn, hyprshot -m region --clipboard-only

# Save
bind=super+shift, c, spawn, hyprshot -m region

# reload config
bind=super,r,reload_config

# menu and terminal
bind=super,space,spawn,rofi -show drun
bind=super,Return,spawn,kitty

# exit
bind=super,m,exit,
bind=super,q,killclient,

# switch window focus
bind=super,Tab,focusstack,next
bind=super,Left,focusdir,left
bind=super,Right,focusdir,right
bind=super,Up,focusdir,up
bind=super,Down,focusdir,down

# swap window
bind=super+shift,Up,exchange_client,up
bind=super+shift,Down,exchange_client,down
bind=super+shift,Left,exchange_client,left
bind=super+shift,Right,exchange_client,right

# switch window status
bind=super,g,toggleglobal,
bind=alt,Tab,toggleoverview,
bind=super,v,togglefloating,
bind=alt,a,togglemaximizescreen,
bind=alt,f,togglefullscreen,
bind=alt+shift,f,togglefakefullscreen,
bind=super+shift,s,minimized,
bind=super,o,toggleoverlay,
bind=super+alt,s,restore_minimized
bind=super,s,toggle_scratchpad,

# scroller layout
bind=alt,e,set_proportion,1.0
bind=alt,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=super,n,switch_layout

# tag switch (shifted space cycling keys out of conflict way)
bind=ctrl+super,Left,viewtoleft,0
bind=ctrl+super,Right,viewtoright,0

bind=super,1,view,1,0
bind=super,2,view,2,0
bind=super,3,view,3,0
bind=super,4,view,4,0
bind=super,5,view,5,0
bind=super,6,view,6,0
bind=super,7,view,7,0
bind=super,8,view,8,0
bind=super,9,view,9,0

# tag: move client to the tag and focus it
bind=super+shift,1,tag,1,0
bind=super+shift,2,tag,2,0
bind=super+shift,3,tag,3,0
bind=super+shift,4,tag,4,0
bind=super+shift,5,tag,5,0
bind=super+shift,6,tag,6,0
bind=super+shift,7,tag,7,0
bind=super+shift,8,tag,8,0
bind=super+shift,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=super+alt,Left,tagmon,left
bind=super+alt,Right,tagmon,right

# gaps
bind=alt+shift,X,incgaps,1
bind=alt+shift,Z,incgaps,-1
bind=alt+shift,R,togglegaps

# movewin
bind=ctrl+shift,Up,movewin,+0,-50
bind=ctrl+shift,Down,movewin,+0,+50
bind=ctrl+shift,Left,movewin,-50,+0
bind=ctrl+shift,Right,movewin,+50,+0

# resizewin
bind=ctrl+alt,Up,resizewin,+0,-50
bind=ctrl+alt,Down,resizewin,+0,+50
bind=ctrl+alt,Left,resizewin,-50,+0
bind=ctrl+alt,Right,resizewin,+50,+0

# Mouse Button Bindings
mousebind=super,btn_left,moveresize,curmove
mousebind=none,btn_middle,togglemaximizescreen,0
mousebind=super,btn_right,moveresize,curresize

# Axis Bindings
axisbind=super,UP,viewtoleft_have_client
axisbind=super,DOWN,viewtoright_have_client

# Volume Knob Control (WirePlumber)
bind = none, XF86AudioRaiseVolume, spawn, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = none, XF86AudioLowerVolume, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = none, XF86AudioMute,        spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# Autostart
exec-once=awww-daemon
exec-once=swaync
exec-once=~/.config/waybar/launch.sh
exec-once=hypridle

exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=/usr/lib/xdg-desktop-portal-wlr
exec-once=/usr/lib/xdg-desktop-portal

# ENV

env=XDG_CURRENT_DESKTOP,sway
env=XDG_SESSION_TYPE,wayland
env=XDG_SESSION_DESKTOP,sway
